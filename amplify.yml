version: 1
frontend:
  phases:
    preBuild:
      commands:
        # La imagen de build de Amplify trae una version de Node anterior a la que
        # exige el CLI de Angular, asi que se fuerza la del .nvmrc del repositorio.
        # --skip-default-packages evita que nvm reinstale los globales de la imagen
        # (cypress, hugo, yarn...), que no usamos y alargan cada build.
        - nvm install --skip-default-packages $(cat .nvmrc)
        - nvm use $(cat .nvmrc)
        - node -v && npm -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # Angular genera la aplicacion dentro de la subcarpeta browser.
    baseDirectory: dist/origen-directo/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .angular/cache/**/*
