<mat-toolbar class="shell__toolbar">
  <span class="shell__brand">OrigenDirecto</span>
  <button type="button" (click)="formOpen.set(true)">Registrar finca</button>
</mat-toolbar>

<main class="shell__content">
  <router-outlet />
  <section class="hero">
    <button type="button" (click)="formOpen.set(true)">Comenzar registro</button>
  </section>
</main>

@if (formOpen()) {
  <app-farm-registration-wizard (closed)="formOpen.set(false)" />
}
