<mat-toolbar class="shell__toolbar">
  <span class="shell__brand">OrigenDirecto</span>
  <button type="button" (click)="formularioAbierto.set(true)">Registrar finca</button>
</mat-toolbar>

<main class="shell__content">
  <router-outlet />
  <section class="hero">
    <button type="button" (click)="formularioAbierto.set(true)">Comenzar registro</button>
  </section>
</main>

@if (formularioAbierto()) {
  <div role="dialog">
    <h3>Datos básicos de la finca</h3>
    <label for="nombreFinca">Nombre de la finca</label>
    <input id="nombreFinca" maxlength="120" [value]="nombreFinca()" (input)="nombreIngresado($event)" />
    <span>{{ nombreFinca().length }}/120</span>
    <button type="button" (click)="cancelar()">Cancelar</button>
    <button type="button" [disabled]="nombreFinca().trim() === ''">Continuar</button>
  </div>
}
