<mat-toolbar class="shell__toolbar">
  <span class="shell__brand">OrigenDirecto</span>
  <button type="button" (click)="formOpen.set(true)">Registrar finca</button>
</mat-toolbar>

<main class="shell__content">
  <router-outlet />
  <section class="hero">
    <button type="button" (click)="formOpen.set(true)">Comenzar registro</button>
  </section>
</main>

@if (formOpen()) {
  <div role="dialog">
    <h3>Datos básicos de la finca</h3>
    <label for="farmName">Nombre de la finca</label>
    <input id="farmName" maxlength="120" [value]="farmName()" (input)="onFarmNameInput($event)" />
    <span>{{ farmName().length }}/120</span>
    <label for="department">Departamento</label>
    <select id="department" [value]="department()" (change)="onDepartmentChange($event)">
      <option value="">Selecciona…</option>
      <option value="Huila">Huila</option>
    </select>
    <label for="municipality">Municipio</label>
    <select id="municipality" [disabled]="department() === ''"></select>
    <label for="village">Vereda o corregimiento</label>
    <input id="village" />
    <label for="area">Extensión o área total</label>
    <input id="area" />
    <select id="areaUnit"></select>
    <span>Variedades de café cultivadas</span>
    <input type="checkbox" />
    <label for="altitude">Altitud promedio</label>
    <input id="altitude" />
    <button type="button" (click)="cancel()">Cancelar</button>
    <button type="button" [disabled]="farmName().trim() === ''">Continuar</button>
  </div>
}
