<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origen Directo · Sitio completo (documentación SDD)</title>
<meta name="description" content="Versión en un solo archivo HTML de Origen Directo: inicio, fincas y registro de origen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--background:oklch(.965 .025 85);--foreground:oklch(.27 .05 45);--card:oklch(.985 .015 85);--primary:oklch(.62 .15 45);--primary-fg:oklch(.985 .015 85);--secondary:oklch(.82 .14 85);--muted:oklch(.93 .03 80);--muted-fg:oklch(.48 .04 50);--border:oklch(.86 .04 70);--destructive:oklch(.577 .22 27);--display:"Fraunces",serif;--sans:"DM Sans",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:16px/1.5 var(--sans)}
h1,h2,h3{font-family:var(--display);margin:0}p{margin:0}a{color:inherit;text-decoration:none}
.wrap{max-width:1152px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--border)}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 24px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:24px;font-weight:700;display:flex;gap:8px;align-items:center}.logo b,.logo svg{color:var(--primary)}
nav{display:flex;gap:24px;align-items:center;font-size:14px;font-weight:500}nav a.on{color:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:var(--primary-fg);border:0;border-radius:999px;padding:8px 16px;font:600 14px var(--sans);cursor:pointer}
.btn.ghost{background:var(--card);color:var(--foreground);border:1px solid var(--border)}
.hero{padding:56px 0;background-image:radial-gradient(color-mix(in oklch,var(--foreground) 14%,transparent) 1px,transparent 1px);background-size:22px 22px}
.badge{display:inline-block;background:var(--secondary);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
.hero h1{margin-top:16px;max-width:768px;font-size:clamp(32px,6vw,48px);line-height:1.15}
.ul{background:linear-gradient(var(--secondary),var(--secondary)) no-repeat 0 90%/100% .35em}
h2{font-size:clamp(26px,4vw,36px)}.sub{color:var(--muted-fg);margin:8px 0 24px}
.track{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.track>*{flex:0 0 100%;scroll-snap-align:start}@media(min-width:768px){.track>*{flex-basis:calc(50% - 12px)}}@media(min-width:1024px){.track>*{flex-basis:calc(33.33% - 16px)}}
.grid{display:grid;gap:24px}@media(min-width:768px){.grid{grid-template-columns:repeat(3,1fr)}}
.lote{display:flex;flex-direction:column;height:100%;background:var(--card);border:1px solid var(--border);border-radius:28px;overflow:hidden}
.lote.off{opacity:.5;filter:grayscale(1)}
.media{position:relative}.media img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.tag{position:absolute;top:12px;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}.tag.n{left:12px;background:var(--secondary)}.tag.f{right:12px;background:var(--card);border:1px solid var(--border)}
.body{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}.body h3{font-size:20px}.muted{color:var(--muted-fg);font-size:14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}dt{color:var(--muted-fg)}dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:8px}.chip{background:var(--muted);border-radius:999px;padding:2px 8px;font-size:12px}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
.sw{display:flex;gap:8px;align-items:center;cursor:pointer}.sw input{accent-color:var(--primary);width:18px;height:18px}
.finca{width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;font:inherit;color:inherit;cursor:pointer}
.finca[aria-pressed=true]{border-color:var(--primary);background:var(--secondary);box-shadow:0 0 0 2px var(--primary)}
.empty{border:2px dashed var(--border);border-radius:20px;padding:40px;text-align:center}
form{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:28px;display:grid;gap:20px;max-width:760px}
label.l{font-weight:600;display:block;margin-bottom:6px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--background);color:inherit}
.opt{display:flex;flex-wrap:wrap;gap:8px}.opt button{border:1px solid var(--border);background:var(--background);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;color:inherit}
.opt button.sel{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.err{color:var(--destructive);font-size:13px;margin-top:4px}.err:empty{display:none}
.files{font-size:13px;color:var(--muted-fg)}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--foreground);color:var(--background);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}#toast.show{opacity:1}
section{padding-bottom:64px}
</style>
</head>

const leer=()=>{try{return JSON.parse(localStorage.getItem(KEY))||SEED}catch{return SEED}};
const escribir=l=>{try{localStorage.setItem(KEY,JSON.stringify(l))}catch{localStorage.setItem(KEY,JSON.stringify(l.map(x=>({...x,evidencias:x.evidencias.map(({url,...e})=>e)}))))}};
const activo=l=>l.activo!==false,finca=id=>FINCAS.find(f=>f.id===id);
const fecha=iso=>new Date(iso+"T12:00:00").toLocaleDateString("es-CO",{day:"numeric",month:"short"}).replace(".","");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("show"),2200)}

function card(l){const f=finca(l.fincaId),foto=(l.evidencias.find(e=>e.url&&e.tipo.startsWith("image/"))||{}).url||IMG;
return `<article class="lote ${activo(l)?"":"off"}"><div class="media"><img src="${foto}" alt="${esc(l.nombre)}" loading="lazy"><span class="tag n">✦ Nuevo</span><span class="tag f">${fecha(l.fecha)}</span></div>
<div class="body"><h3>${esc(l.nombre)}</h3><p class="muted">📍 ${esc(f?.nombre)} · ${esc(f?.region)}</p>
<dl><dt>Variedad</dt><dd>${esc(l.variedades.join(", "))}</dd><dt>Proceso</dt><dd>${esc(l.proceso)}</dd><dt>Tueste</dt><dd>${esc(l.tueste)}</dd><dt>Altura</dt><dd>${l.altura} m.s.n.m.</dd></dl>
<div class="chips">${l.notas.map(n=>`<span class="chip">${esc(n)}</span>`).join("")}</div></div></article>`}

/* ===== Inicio ===== */
function inicio(){const ls=leer().filter(l=>l.estado==="publicado"&&activo(l));
return `<section class="hero"><span class="badge">🌱 Del cafetal a tu taza</span><h1>Conoce el origen y el proceso artesanal de cada finca</h1></section>
<section><h2><span class="ul">Novedades</span></h2><p class="sub">Últimos lotes publicados por los caficultores</p>
<div class="track">${ls.map(l=>`<div>${card(l)}</div>`).join("")||"<p class='muted'>Aún no hay lotes publicados.</p>"}</div></section>`}

/* ===== Fincas ===== */
let fincaSel=FINCAS[0].id;
function fincas(){const todos=leer().filter(l=>l.fincaId===fincaSel),pub=todos.filter(l=>l.estado==="publicado"),bor=todos.length-pub.length,f=finca(fincaSel);
return `<section style="padding-top:48px"><h2><span class="ul">Fincas</span></h2><p class="sub">Selecciona una finca para ver sus lotes</p>
<div class="grid">${FINCAS.map(x=>`<button class="finca" aria-pressed="${x.id===fincaSel}" data-finca="${x.id}"><h3>${x.nombre}</h3><p class="muted">${x.region} · ${x.productor}</p></button>`).join("")}</div></section>
<section><h2 style="font-size:28px">Lotes de ${f.nombre}</h2><p class="sub">${pub.length} publicado(s)</p>
${pub.length?`<div class="grid">${pub.map(l=>`<div><div class="ctl"><label class="sw"><input type="checkbox" data-act="${l.id}" ${activo(l)?"checked":""}>${activo(l)?"Activo":"Desactivado"}</label><a class="btn ghost" href="#/registrar?editar=${l.id}">✎ Editar</a></div>${card(l)}</div>`).join("")}</div>`
:`<div class="empty"><p class="muted">Aún no hay lotes publicados en esta finca</p><p style="margin-top:12px"><a class="btn" href="#/registrar">Registrar Origen</a></p></div>`}
${bor?`<p class="muted" style="margin-top:16px">${bor} borrador(es) sin publicar.</p>`:""}</section>`}

/* ===== Registro ===== */
let d,orig,archivos;
function validar(d){const e={};
 if(!d.fincaId)e.fincaId="Seleccione la finca asociada";
 if(!d.nombre.trim())e.nombre="Ingrese el nombre del lote";else if(d.nombre.length>100)e.nombre="Máximo 100 caracteres";
 if(!d.variedades.length)e.variedades="Debe indicar la variedad del grano";
 if(!d.proceso)e.proceso="Seleccione el método de fermentación";
 if(!d.tueste)e.tueste="Seleccione el perfil de tueste";
 if(!d.notas.length)e.notas="Agregue al menos una nota de cata";
 const a=String(d.altura).trim();if(!a)e.altura="Indique la altura del cultivo";else if(!/^\d+$/.test(a))e.altura="Solo se permiten números";else if(+a<100||+a>4000)e.altura="Ingrese una altura entre 100 y 4000 m.s.n.m.";
 return e}
function registrar(q){const id=new URLSearchParams(q).get("editar");orig=id&&leer().find(l=>l.id===id);
 d=orig?{...orig,altura:String(orig.altura??""),variedades:[...orig.variedades],notas:[...orig.notas]}:{fincaId:"",nombre:"",variedades:[],proceso:"",procesoDescripcion:"",tueste:"",notas:[],altura:""};
 archivos=orig?[...orig.evidencias]:[];
 const chips=(k,ops)=>`<div class="opt" data-k="${k}">${ops.map(o=>`<button type="button" data-v="${o}">${o}</button>`).join("")}</div><p class="err" data-e="${k}"></p>`;
 return `<section style="padding-top:48px"><h2><span class="ul">${orig?"Editar lote":"Registro de Origen"}</span></h2><p class="sub">Documenta la trazabilidad de tu lote de café</p>
<form id="f" novalidate>
<div><label class="l">Finca asociada *</label><select name="fincaId"><option value="">Selecciona…</option>${FINCAS.map(f=>`<option value="${f.id}">${f.nombre} · ${f.region}</option>`).join("")}</select><p class="err" data-e="fincaId"></p></div>
<div><label class="l">Nombre del lote *</label><input type="text" name="nombre" maxlength="120" placeholder="Ej: Lote 4 · Bourbon Natural"><p class="err" data-e="nombre"></p></div>
<div><label class="l">Variedad *</label>${chips("variedades",VARIEDADES)}</div>
<div><label class="l">Proceso / fermentación *</label><select name="proceso"><option value="">Selecciona…</option>${PROCESOS.map(p=>`<option>${p}</option>`).join("")}</select><p class="err" data-e="proceso"></p>
<textarea name="procesoDescripcion" rows="2" placeholder="Describe el proceso (opcional)" style="margin-top:8px"></textarea></div>
<div><label class="l">Perfil de tueste *</label>${chips("tueste",TUESTES)}</div>
<div><label class="l">Notas de cata *</label><input type="text" id="nota" placeholder="Escribe una nota y presiona Enter"><div class="chips" id="notas"></div><p class="err" data-e="notas"></p></div>
<div><label class="l">Altura (m.s.n.m.) *</label><input type="text" inputmode="numeric" name="altura" placeholder="Ej: 1750"><p class="err" data-e="altura"></p></div>
<div><label class="l">Evidencias (JPG, PNG o PDF · máx. 5 MB)</label><input type="file" id="arch" multiple accept=".jpg,.jpeg,.png,.pdf"><div class="thumbs" id="thumbs"></div></div>
<div style="display:flex;gap:12px;flex-wrap:wrap">${orig?`<button class="btn" data-accion="${orig.estado}">Guardar cambios</button>`:`<button class="btn ghost" data-accion="borrador">Guardar borrador</button><button class="btn" data-accion="publicado">Publicar registro</button>`}</div>
</form></section>`}
function pintarForm(){const f=$("#f");if(!f)return;
 ["fincaId","nombre","proceso","procesoDescripcion","altura"].forEach(k=>f.elements[k].value=d[k]??"");
 f.querySelectorAll(".opt").forEach(o=>{const k=o.dataset.k;o.querySelectorAll("button").forEach(b=>b.classList.toggle("sel",k==="tueste"?d.tueste===b.dataset.v:d.variedades.includes(b.dataset.v)))});
 $("#notas").innerHTML=d.notas.map((n,i)=>`<span class="chip">${esc(n)} <a href="#" data-quitar="${i}">✕</a></span>`).join("");
 $("#thumbs").innerHTML=archivos.map(a=>a.url&&a.tipo.startsWith("image/")?`<img src="${a.url}" alt="">`:`<span class="chip">📄 ${esc(a.nombre)}</span>`).join("")}
function enlazarForm(){const f=$("#f");if(!f)return;pintarForm();
 f.addEventListener("input",e=>{if(e.target.name)d[e.target.name]=e.target.value});
 f.addEventListener("click",e=>{const b=e.target.closest(".opt button");if(b){const k=b.closest(".opt").dataset.k,v=b.dataset.v;
   if(k==="tueste")d.tueste=v;else d.variedades=d.variedades.includes(v)?d.variedades.filter(x=>x!==v):[...d.variedades,v];pintarForm()}
  const q=e.target.closest("[data-quitar]");if(q){e.preventDefault();d.notas.splice(+q.dataset.quitar,1);pintarForm()}});
 $("#nota").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const v=e.target.value.trim();if(v&&!d.notas.includes(v))d.notas.push(v);e.target.value="";pintarForm()}});
 $("#arch").addEventListener("change",async e=>{for(const file of e.target.files){
   if(!TIPOS_OK.includes(file.type)){toast(`${file.name}: formato no permitido`);continue}
   if(file.size>MAX_BYTES){toast(`${file.name}: supera 5 MB`);continue}
   const url=file.type.startsWith("image/")?await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)}):undefined;
   archivos.push({nombre:file.name,tipo:file.type,tamano:file.size,url})}e.target.value="";pintarForm()});
 f.addEventListener("submit",e=>{e.preventDefault();const estado=e.submitter.dataset.accion,err=validar(d);
  f.querySelectorAll("[data-e]").forEach(p=>p.textContent=err[p.dataset.e]||"");
  if(estado==="publicado"&&Object.keys(err).length){toast("Revisa los campos marcados");return}
  if(estado==="borrador"&&!d.nombre.trim()){f.querySelector('[data-e=nombre]').textContent="Ingrese el nombre del lote";return}
  const lote={...d,id:orig?.id||crypto.randomUUID(),fecha:orig?.fecha||new Date().toISOString().slice(0,10),altura:d.altura?+d.altura:null,evidencias:archivos,estado,activo:orig?activo(orig):true};
  escribir([lote,...leer().filter(x=>x.id!==lote.id)]);
  toast(orig?"Cambios guardados":estado==="publicado"?"¡Origen registrado con éxito!":"Borrador guardado");
  fincaSel=lote.fincaId;location.hash="#/fincas"})}

/* ===== Navegación por hash ===== */
function render(){const [ruta,q=""]=(location.hash.slice(2)||"").split("?"),app=$("#app");
 document.querySelectorAll("nav a[data-r]").forEach(a=>a.classList.toggle("on",a.dataset.r===ruta));
 app.innerHTML=ruta==="fincas"?fincas():ruta==="registrar"?registrar(q):inicio();
 if(ruta==="registrar")enlazarForm();window.scrollTo(0,0)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-finca]");if(b){fincaSel=b.dataset.finca;render()}});
document.addEventListener("change",e=>{const id=e.target.dataset?.act;if(id){const on=e.target.checked;escribir(leer().map(x=>x.id===id?{...x,activo:on}:x));toast(on?"Lote activado":"Lote desactivado: no visible para compradores");render()}});
addEventListener("hashchange",render);render();
</script>
</body>
</html>
